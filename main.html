<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- the entire body must be written by student -->
  <script type="text/javascript" src="./script.js"></script>

  <form method="post">
    <!-- Name Field -->
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Name" required>
    </div>

    <!-- Email Field -->
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Email" required>
    </div>

    <!-- Gender Field -->
    <div>
      <p>Gender</p>
      <input type="radio" id="gender_m" name="gender" value="male" required>
      <label for="gender_m">Male</label>
      
      <input type="radio" id="gender_f" name="gender" value="female" required>
      <label for="gender_f">Female</label>
    </div>
    
    <!-- Car Brands Dropdown -->
    <div>
      <label for="cars">Car Brands</label>
      <select id="cars" name="cars" required>
        <option value="" disabled selected>Select a brand</option>
        <option value="audi">Audi</option>
        <option value="tata">TATA</option>
        <option value="mahindra">Mahindra</option>
      </select>
    </div>

    <!-- Age Field -->
    <div>
      <label for="age">Age</label>
      <input type="number" id="age" name="age" placeholder="Age" required>
    </div>

    <!-- DOB Field -->
    <div>
      <label for="dob">DOB</label>
      <input type="date" id="dob" name="dob" required>
    </div>
    
    <!-- Phone Number Field (Optional) -->
    <div>
      <label for="tel">Phone Number</label>
      <!-- Removed 'required="no"' entirely since it is optional -->
      <input type="tel" id="tel" name="tel" placeholder="xxx-xxx-xxxx">
    </div>

    <!-- Password Field -->
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Password" required>
    </div>

    <!-- TOS Checkbox -->
    <div>
      <input type="checkbox" id="tos" name="tos" required>
      <label for="tos">I agree to the TOS</label>
    </div>

    <!-- Submit Button -->
    <div>
      <button type="submit">Submit</button>
    </div>
  </form>

</body>
</html>
